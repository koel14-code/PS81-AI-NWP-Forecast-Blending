services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: skyblend-backend
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: skyblend-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
